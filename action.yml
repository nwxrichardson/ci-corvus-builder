name: 'corvus-build'
description: 'Generate a comment showing Corvus comparisons'
inputs: 
  model-location:
    description: 'The location that the metamodel'
    default: ''
  odesign-location:
    description: 'The location that the odesign'
    default: ''
  edit-location:
    description: 'The location that the edit'
    default: ''
branding:
  icon: 'box'
  color: 'purple'
runs:
  using: 'composite'
  steps:
    - name: Set up JDK 21 for x64
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Checkout ci-corvus
      uses: actions/checkout@v4
      with: 
        repository: nwxrichardson/ci-corvus
    - name: Checkout ci-corvus
      uses: actions/checkout@v4
      with: 
        repository: epsilonlabs/sirius-pr-action-workspace
        path: model
    - name: Move model
      run : mv $(pwd)/model/bundles/${{ inputs.model-location }} $(pwd)/bundles
      shell: bash
    - name: Move edit
      run : mv $(pwd)/model/bundles/${{ inputs.odesign-location }} $(pwd)/bundles
      shell: bash
    - name: Move design
      run : mv $(pwd)/model/bundles/${{ inputs.edit-location }} $(pwd)/bundles
      shell: bash
    - name: Tree
      run : tree
      shell: bash
    - name: Edit product
      run : sed '44a\      <plugin id="${{ inputs.model-location }}"/>\n      <plugin id="${{ inputs.edit-location }}"/>\n      <plugin id="${{ inputs.odesign-location }}"/>' $(pwd)/products/uk.ac.york.ci.corvus.product/corvus.ci.product > $(pwd)/products/uk.ac.york.ci.corvus.product/corvus.ci.product
      shell: bash
    - name: Maven Build
      run : mvn clean verify
      shell: bash
    - name: Docker build
      run : docker build -t nwrichardson/ci-corvus:latest . 
      shell: bash   
    - name: Docker push
      run : docker push nwrichardson/ci-corvus:latest
      shell: bash
